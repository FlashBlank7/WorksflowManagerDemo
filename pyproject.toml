[project]
name = "bench-workbench"
version = "0.1.0"
description = "终端里的工作流管家：对话式生成、运行、统筹工作流（本地薄壳 + 远端工厂）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
bench = "bench.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]
