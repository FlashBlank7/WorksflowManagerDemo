[project]
name = "guanjia"
version = "0.6.0"
description = "管家 — 终端里说人话，远端工厂替你造出能跑、有定时、可监控的工作流"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
guanjia = "guanjia.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guanjia"]
