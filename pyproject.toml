[project]
name = "guanjia"
version = "0.7.0"
description = "管家 — 终端里说人话，远端工厂替你造出能跑、有定时、可监控的工作流"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
# 指向 _run_cli 而不是 main：兜底在 _run_cli 里。
# 指错的话，`python -m guanjia` 有兜底而装出来的 `guanjia` 命令没有——
# 而用户用的正是后者。
guanjia = "guanjia.__main__:_run_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guanjia"]
